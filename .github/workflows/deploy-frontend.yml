name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL:          ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:     ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}

      # ── 3. Clear remote public_html ────────────────────────────────────────
      - name: Clear public_html on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port:     65002
          script:   find ~/public_html -mindepth 1 -delete 2>/dev/null || true

      # ── 4. Upload dist/ → public_html ─────────────────────────────────────
      - name: Upload dist/ to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host:             ${{ secrets.FTP_SERVER }}
          username:         ${{ secrets.FTP_USERNAME }}
          password:         ${{ secrets.FTP_PASSWORD }}
          port:             65002
          source:           "dist/"
          target:           "public_html"
          strip_components: 1

      # ── 5. Push deploy branch (audit trail) ───────────────────────────────
      - name: Publish to deploy branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git reset --hard
          cp -r dist/. .
          rm -rf dist node_modules
          git add -A
          git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M UTC') @ ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:deploy

      # ── 6. Summary ────────────────────────────────────────────────────────
      - name: Deploy summary
        run: |
          echo "✅ Deploy complete"
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date -u '+%Y-%m-%d %H:%M UTC')"
