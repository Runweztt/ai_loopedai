name: Deploy Frontend to Hostinger

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the Vite app
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL:          ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:     ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}

      # 5. Upload dist/ directly to public_html via FTP
      #    No git state, no divergence errors — just files.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:               ${{ secrets.FTP_SERVER }}
          username:             ${{ secrets.FTP_USERNAME }}
          password:             ${{ secrets.FTP_PASSWORD }}
          local-dir:            ./dist/
          server-dir:           /public_html/
          dangerous-clean-slate: true

      # 6. Summary
      - name: Deploy summary
        run: |
          echo "✅ FTP deploy complete"
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date -u '+%Y-%m-%d %H:%M UTC')"
