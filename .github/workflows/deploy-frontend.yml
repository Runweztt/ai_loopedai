name: Deploy Frontend to Hostinger

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the Vite app
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL:          ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:     ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}

      # 5. Upload dist/ to public_html via rsync over SSH (port 65002)
      #    FTP is blocked by Hostinger's firewall — SSH always works.
      - name: Deploy via SSH/rsync
        env:
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASS" rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 65002" \
            dist/ "${SSH_USER}@${SSH_HOST}:~/public_html/"

      # 6. Summary
      - name: Deploy summary
        run: |
          echo "✅ SSH/rsync deploy complete"
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date -u '+%Y-%m-%d %H:%M UTC')"
