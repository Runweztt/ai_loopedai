name: Deploy Frontend to Hostinger

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # needed to push the deploy branch

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the Vite app
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # 5. Push the built dist/ folder to the 'deploy' branch
      #    Hostinger pulls from this branch — it must contain ONLY the
      #    ready-to-serve files (index.html, assets/, etc.)
      - name: Push dist/ to deploy branch
        run: |
          cd dist
          git init
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}"
          git push --force \
            "https://x-token-auth:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:deploy

      # 6. Call Hostinger's webhook — this triggers Hostinger to pull the
      #    updated 'deploy' branch into public_html automatically.
      #
      #    How to get the webhook URL:
      #      hPanel → Git → your repo → copy the webhook URL
      #    Then add it as a GitHub secret: HOSTINGER_WEBHOOK_URL
      - name: Trigger Hostinger deployment
        run: |
          curl -s -X POST "${{ secrets.HOSTINGER_WEBHOOK_URL }}" \
            --max-time 15 \
            --retry 3 \
          && echo "✅ Hostinger deploy triggered" \
          || echo "⚠️  Webhook call failed — deploy branch was still updated"
        continue-on-error: true

      # 7. Summary
      - name: Deploy summary
        run: |
          echo "✅ Build pushed to 'deploy' branch"
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date -u '+%Y-%m-%d %H:%M UTC')"
