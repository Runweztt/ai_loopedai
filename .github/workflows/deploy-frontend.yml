name: Deploy Frontend to Hostinger

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL:          ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:     ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}

      # ── 2. Push dist/ to the deploy branch ──────────────────────────────────
      # The deploy branch contains only the compiled output.
      # The webhook receiver on the server pulls this branch to get the files.
      - name: Publish dist/ to deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Orphan the deploy branch so it holds only build artefacts
          git checkout --orphan deploy
          git reset --hard

          # Move the compiled output to the repo root so Hostinger can serve it
          cp -r dist/. .
          rm -rf dist node_modules

          git add -A
          git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M UTC') @ ${{ github.sha }}"

          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:deploy

  # ── 3. Trigger webhook ──────────────────────────────────────────────────────
  trigger-deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Ping deploy webhook
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            --max-time 30 \
            -d '{
              "repo":   "${{ github.repository }}",
              "branch": "deploy",
              "ref":    "${{ github.ref }}",
              "sha":    "${{ github.sha }}"
            }')

          echo "Webhook response (HTTP $HTTP_STATUS):"
          cat /tmp/webhook_response.txt

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ Webhook returned non-2xx status: $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Deploy webhook acknowledged"

      - name: Deploy summary
        run: |
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Branch : deploy (artefacts only)"
