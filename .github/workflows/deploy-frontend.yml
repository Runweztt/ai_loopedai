name: Deploy Frontend to Hostinger

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL:          ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL:          ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY:     ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}

      # ── 2. Deploy dist/ to Hostinger via SSH/rsync ──────────────────────────
      # Primary deployment — always runs so the live site is updated immediately.
      - name: Deploy to Hostinger via rsync
        env:
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASS" rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 65002" \
            dist/ "${SSH_USER}@${SSH_HOST}:~/public_html/"

      # ── 3. Push dist/ to the deploy branch (audit trail) ────────────────────
      # Keeps a deployable snapshot in git so the webhook receiver can pull it
      # once it is set up. Safe to skip if GITHUB_TOKEN has no write perms.
      - name: Publish dist/ to deploy branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan deploy
          git reset --hard

          cp -r dist/. .
          rm -rf dist node_modules

          git add -A
          git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M UTC') @ ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:deploy

      # ── 4. Ping optional webhook ─────────────────────────────────────────────
      - name: Ping deploy webhook (optional)
        env:
          WEBHOOK_URL:    ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️  DEPLOY_WEBHOOK_URL not set — skipping webhook ping."
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /tmp/wh.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: $WEBHOOK_SECRET" \
            --max-time 30 \
            -d "{\"repo\":\"${{ github.repository }}\",\"branch\":\"deploy\",\"sha\":\"${{ github.sha }}\"}")

          cat /tmp/wh.txt
          [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ] \
            && echo "✅ Webhook acknowledged" \
            || { echo "❌ Webhook HTTP $HTTP_STATUS"; exit 1; }

      # ── 5. Summary ───────────────────────────────────────────────────────────
      - name: Deploy summary
        run: |
          echo "✅ rsync deploy complete"
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date -u '+%Y-%m-%d %H:%M UTC')"
